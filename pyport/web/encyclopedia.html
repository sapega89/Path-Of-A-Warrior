d not to chase Lord Geoffrey's forces and have instead dispersed into smaller groups. In another turn of events, Lord Wesley discovered the sought after Royal Seal, and on his way home was promptly attacked by Lord Caden of Regal Canyon. Lord Wesley was fortunate enough to escape with his life, and is now leading a punitive mission back to Regal Canyon to settle the score. Your mission objective is to support Lord Wesley in his counter-attack. Yes or no?","hidden":true,"talk":74},{"id":19,"no":20,"sc":5,"scn":"Royal Seal","k":1,"ru":9,"rn":"Lord Anthony","rp":"noface.png","pal":2,"boss":12,"bl":4,"gold":750,"time":98,"succ":204,"fail":0,"sold":{"201":480,"202":0,"203":0},"foes":[[12,4]],"fr":[],"brief":"Lord Wesley has discovered the coveted Royal Seal. Lord Caden of Regal Canyon ambushed Lord Wesley in hopes of recovering the Royal Seal himself, but good fortune shone upon Lord Wesley and he escaped. Now, Lord Wesley is heading back to Regal Canyon for a counter-attack and Lord Caden is in distress. Lord Caden knows he cannot face an enraged Lord Wesley by himself and has pleaded for support. Your mission objective is to intercept Lord Wesley and stop him. Do you accept this mission?","hidden":true,"end":"Unnamed Hero"},{"id":20,"no":21,"sc":6,"scn":"Brown Soil","k":0,"ru":6,"rn":"Lord Herbert","rp":"noface.png","pal":2,"boss":14,"bl":3,"gold":450,"time":246,"succ":15,"fail":0,"sold":{"201":63,"202":0,"203":0},"foes":[[14,3]],"fr":[],"brief":"Lord Bartholomew is foolish indeed! It is a good thing Lord Gabriel disassociated with Lord Bartholomew prior to the upcoming battle. Here is the story: Lord Bartholomew returned to his land, White Highland, dissatisfied with his holdings, even though he had made off with a modest amount of gold stolen from Empyrean Castle. He decided to expand his land by annexing Ecru Terra, a plot of land adjacent to his property.The clever Lord Eugene became aware of Lord Bartholomew's intentions and cooked up a plan to swindle him. Lord Eugene contacted Lord Bartholomew and suggested they jointly attack Ecru Terra and split the land. After Lord Bartholomew agreed, Lord Eugene dispatched a messenger to Lord Berenger of Ecru Terra to warn him of Lord Bartholomew's impending attack on his land. Out of fear, Lord Berenger asked Lord Eugene for help, which allowed Lord Eugene to move into Ecru Terra and bloodlessly conquer the land himself. Lord Bartholomew soon learned he had been cheated, and sent his younger brother, General Sonton, to deliver a message to Lord Eugene, demanding his share of the Ecru Terra. In response, Lord Eugene has executed General Sonton, and now an enraged Lord Bartholomew is charging towards Lord Eugene's army, vowing to unleash carnage. Lord Bartholomew has requested your support. Will you help him revenge himself upon Lord Eugene?","hidden":false,"talk":15},{"id":21,"no":22,"sc":6,"scn":"Brown Soil","k":1,"ru":7,"rn":"Lord Eugene","rp":"noface.png","pal":1,"boss":15,"bl":5,"gold":750,"time":246,"succ":14,"fail":0,"sold":{"201":63,"202":0,"203":0},"foes":[[15,5]],"fr":[79],"brief":"Lord Eugene sent Lord Bartholomew a letter, suggesting they attack Ecru Terra and split the land evenly. Once Lord Bartholomew agreed to the plan, Lord Eugene dispatched a messenger to Lord Berenger of Ecru Terra warning him of Lord Bartholomew's preparation to seize his land. Fearing for his safety, Lord Berenger asked Lord Eugene for help. Lord Eugene agreed and promptly moved into Ecru Terra, conquering it as he went.Lord Bartholomew realized that he had been swindled and sent General Sonton, his younger brother, to demand his share of Ecru Terra. Instead, Lord Eugene cold-bloodedly executed General Sonton. An enraged Lord Bartholomew is now charging towards Lord Eugene's forces to avenge his brother's death. Lord Eugene is requesting your support. Your mission objective is to quell Lord Bartholomew's assault. Do you accept this mission?","hidden":false,"talk":14},{"id":22,"no":23,"sc":7,"scn":"T <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const IT = {}; D.items.forEach(i => IT[i.id] = i);
const CN = {}; D.cons.forEach(c => CN[c.id] = c);
const SK = {}; D.skills.forEach(s => SK[s.id] = s);
const GN = {}; D.gens.forEach(g => GN[g.id] = g);
const MS = {}; D.mis.forEach(m => MS[m.id] = m);
const SC = {}; D.scen.forEach(s => SC[s.id] = s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img = (k, cls = "px", alt = "") => `<img class="${cls}" src="${D.img[k]}" alt="${esc(alt)}" loading="lazy">`;
const CAT = {n: "Звичайний", s: "Особливий", r: "Рідкісний", c: "Витратний"};
const CATTAG = {n: "", s: "ok", r: "gold", c: "mute"};
let heroLv = 20;
try { const v = +localStorage.getItem("enc-lv"); if (v > 0) heroLv = v; } catch (e) {}
document.getElementById("hl").value = heroLv;

/* ---------- links ---------- */
const itemLink = id => { const i = IT[id]; return i ? `<a class="chip" href="#item-${id}">${img(i.ic, "px sm", i.n)}${esc(i.n)}</a>` : "#" + id; };
const genLink = id => { const g = GN[id]; return g ? `<a class="chip" href="#gen-${id}">${img(g.img, "por sm", g.n)}${esc(g.n)}</a>` : "#" + id; };
const genText = id => GN[id] ? `<a class="x" href="#gen-${id}">${esc(GN[id].n)}</a>` : "";
const misText = id => { const m = MS[id]; return `<a class="x" href="#mis-${id}">#${m.no} ${esc(m.scn)}${SC[m.sc].ms.length > 1 ? " " + (m.k + 1) : ""}</a>`; };
const skillLink = id => { const s = SK[id]; return `<a class="chip" href="#skill-${id}">${img(s.ic, "px sm", s.n)}${esc(s.n)}</a>`; };
const statStr = s => Object.entries(s).map(([k, v]) => `${k} ${v}`).join(" · ") || "—";
const kv = pairs => `<div class="kv">${pairs.filter(p => p[1] !== "" && p[1] != null).map(([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`).join("")}</div>`;

/* enemy general stats (c.java:1021-1026) */
const genStats = (g, bonus) => { const L = heroLv + bonus; return {L, atk: Math.trunc((g.atk + L - 1) * 6 / 5), df: Math.trunc((g.df + L - 1) * 6 / 5), hp: g.hp + (L - 1) * 3}; };

/* ---------- items ---------- */
const allItems = D.items.concat(D.cons.map(c => ({...c, cat: "c", t: -1, lv: 1, s: {}})));
function itemBody(i) {
  if (i.cat === "c") {
    return kv([["Ефект", esc(i.e)], ["Ціна", i.p], ["Продаж", Math.floor(i.p / 2)], ["Стек", "до 5"]]) +
      `<h4>Де взяти</h4><p class="small">${i.shop ? "Кузня → Buy Item (завжди в наявності). " : "У кузні не продається. "}Випадає з ворогів, коли замість предмета падає витратний (див. вкладку Вороги).</p>`;
  }
  let h = kv([["Тип", D.types[i.t]], ["Стати", statStr(i.s)], ["Рівень", i.lv], ["Макс. заточка", i.me ? "+" + i.me : "не заточується"],
             ["Ціна", i.p != null ? i.p : ""], ["Продаж", i.p != null ? Math.floor(i.p / 2) : ""]]);
  if (i.note) h += `<p class="small"><span class="tag gold">Особливе</span>${esc(i.note)}</p>`;
  h += `<h4>Де взяти</h4>`;
  if (i.cat === "n") {
    h += `<p class="small">Кузня → Buy Item (випадковий асортимент, оновлюється після кожної місії). Дроп з ворогів: частка серед предметів, що випали, за рівнем героя:</p>
      <div class="links">${i.drop.map(([r, p]) => `<span class="tag">Lv ${r}: ${p}%</span>`).join("") || '<span class="muted">не випадає</span>'}</div>`;
  } else if (!i.from.length) h += `<p class="small">Лише через Live (обмін між гравцями).</p>`;
  if (i.from.length) h += `<p class="small">Combine Items у кузні (${i.from.length} ${i.from.length === 1 ? "рецепт" : "рецепти"}):</p>` + i.from.map(r => recRow(D.rec[r], false)).join("");
  if (i.use.length) h += `<h4>Інгредієнт у ${i.use.length} рецептах</h4>` + i.use.map(r => recRow(D.rec[r], true)).join("");
  return h;
}
function recRow(r, showRes) {
  return `<div class="rec">${r.a.map(itemLink).join('<span class="plus">+</span>')}${showRes ? '<span class="plus">→</span>' + itemLink(r.r) : ""}<span class="tag mute">шанс ${r.p}%</span></div>`;
}
function itemSum(i) {
  return `${img(i.ic, "px", i.n)}<div class="sum"><h3>${esc(i.n)}</h3><div class="sub"><span class="tag ${CATTAG[i.cat]}">${CAT[i.cat]}</span>${i.cat === "c" ? esc(i.e) : `${esc(D.types[i.t])} · Lv ${i.lv} · ${statStr(i.s)}`}</div></div>`;
}
function renderItems() {
  const opts = D.types.map((t, k) => `<option value="${k}">${esc(t)}</option>`).join("");
  M.innerHTML = `<div class="tools">
    <input type="search" id="fq" placeholder="Назва предмета" aria-label="Назва предмета">
    <select id="fc" aria-label="Категорія"><option value="">Усі категорії</option><option value="n">Звичайні</option><option value="s">Особливі</option><option value="r">Рідкісні</option><option value="c">Витратні</option></select>
    <select id="ft" aria-label="Тип"><option value="">Усі типи</option>${opts}</select>
    <label class="chk" for="fl"><input type="checkbox" id="fl"> до мого рівня</label>
    <span class="count" id="cnt"></span></div><div class="list" id="L"></div>`;
  const f = () => {
    const q = $("fq").value.trim().toLowerCase(), c = $("fc").value, t = $("ft").value, lv = $("fl").checked;
    const rows = allItems.filter(i => (!q || i.n.toLowerCase().includes(q)) && (!c || i.cat === c) && (t === "" || i.t === +t) && (!lv || i.lv <= heroLv));
    $("cnt").textContent = rows.length + " із " + allItems.length;
    $("L").innerHTML = rows.map(i => entry((i.cat === "c" ? "cons-" : "item-") + i.id, itemSum(i), () => itemBody(i))).join("") || '<p class="empty">Нічого не знайдено.</p>';
  };
  ["fq", "fc", "ft", "fl"].forEach(id => $(id).addEventListener("input", f));
  f();
}

/* ---------- skills ---------- */
function renderSkills() {
  M.innerHTML = `<p class="muted">19 скілів. Рівні 1–10 героя вчать генерали під час візитів (Visiting). MP росте з кожним рівнем скіла. Під час будь-якого скіла герой не отримує шкоди.</p><div class="list" id="L"></div>`;
  $("L").innerHTML = D.skills.map(s => entry("skill-" + s.id,
    `${img(s.ic, "px", s.n)}<div class="sum"><h3>${esc(s.n)}</h3><div class="sub"><span class="tag">${s.cat}</span>${esc(s.catn)} · ${esc(s.d)} · MP ${s.mp1}–${s.mp10}</div></div>`,
    () => kv([["Категорія", `${s.cat} · ${esc(s.catn)}`], ["MP (рівень 1)", s.mp1], ["MP (рівень 10)", s.mp10], ["Бонус шкоди", s.bonus || "—"]]) +
      `<p>${esc(s.e)}</p>` +
      `<h4>Хто навчить (візит)</h4><div class="links">${s.by.map(genLink).join("") || '<span class="muted">ніхто з генералів для візитів</span>'}</div>` +
      `<h4>Вороги, що його використовують (${s.foe.length})</h4><div class="links">${s.foe.map(genText).join(" ") || '<span class="muted">—</span>'}</div>`
  )).join("");
}

/* ---------- enemies ---------- */
function renderEnemies() {
  const st = D.stable;
  const table = t => `<div class="scroll"><table><thead><tr><th>Твій рівень</th><th>Рівень ворога</th><th>ATK</th><th>DEF</th><th>HP</th></tr></thead><tbody>${
    st.map(r => `<tr><td class="num">${r.lp}</td><td class="num">${r.lv}</td>${r.u[t].map(v => `<td class="num">${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const bosses = D.mis.map(m => ({m, g: GN[m.boss]}));
  M.innerHTML = `<h2>Солдати</h2><p class="muted">Рівень солдата береться від рівня героя з невеликим випадковим зсувом. MP у ворогів немає. DEF = рівень − 1, HP = база + 3·рівень.</p>
    <div class="cards">${D.enemies.map((e, t) => `<div class="card" id="foe-${e.id}"><div class="row">${img(e.ic, "px tall", e.n)}<div class="sum"><h3>${esc(e.n)}</h3><div class="sub">${esc(e.en)} · тип ${e.id}${e.mult !== 100 ? " · ATK ×1.5" : ""}</div></div></div><p class="small">${esc(e.note)}</p>${table(t)}</div>`).join("")}</div>
    <h2>Забарвлення</h2><p class="muted">Кожна місія перефарбовує солдатів однією з чотирьох палітр. Сила від кольору не залежить.</p>
    <div class="pals">${D.pals.map((p, k) => `<figure>${img(p[0], "px tall")}${img(p[1], "px tall")}<figcaption>${k ? "палітра " + k : "оригінал"}</figcaption></figure>`).join("")}</div>
    <h2>Генерали як вороги</h2><p class="muted">Генерал виходить у кімнаті як окремий ворог з рівнем «твій рівень + бонус кімнати». ATK = (база + L − 1)·6/5, DEF = (база + L − 1)·6/5, HP = база + 3·(L − 1). Генерал б'є своїми скілами, хилиться до 3 разів при HP нижче 50% і контратакує з шансом 15%. Нижче цілі місій з їх силою при твоєму рівні ${heroLv}.</p>
    <div class="scroll"><table><thead><tr><th>Місія</th><th>Ціль</th><th>Рівень</th><th>ATK</th><th>DEF</th><th>HP</th></tr></thead><tbody>${
      bosses.map(({m, g}) => { const s = genStats(g, m.bl); return `<tr><td>${misText(m.id)}</td><td>${genText(g.id)}</td><td class="num">${s.L} (+${m.bl})</td><td class="num">${s.atk}</td><td class="num">${s.df}</td><td class="num">${s.hp}</td></tr>`; }).join("")}</tbody></table></div>
    <h2>Що випадає</h2>
    <div class="scroll"><table><thead><tr><th>Ворог</th><th>Шанс дропу</th><th>З них предмет</th><th>Інакше</th></tr></thead><tbody>
      <tr><td>Солдат</td><td class="num">5%</td><td class="num">10%</td><td rowspan="3" class="small">витратний предмет (зілля або бомба). Без дропу: 25% на мішечок золота (20, на Hard 40)</td></tr>
      <tr><td>Генерал</td><td class="num">10%</td><td class="num">30%</td></tr>
      <tr><td>Ціль місії</td><td class="num">20%</td><td class="num">60%</td></tr></tbody></table></div>
    <p class="small muted">Предмет завжди звичайний (Normal); його рівень (тір) залежить від рівня героя, розподіл є в картці кожного предмета.</p>`;
}

/* ---------- generals ---------- */
function genSum(g) {
  const tags = [g.visit ? '<span class="tag ok">візит</span>' : "", g.boss.length ? `<span class="tag bad">ціль ×${g.boss.length}</span>` : ""].join("");
  return `${img(g.img, "por", g.n)}<div class="sum"><h3>${esc(g.n)}</h3><div class="sub">${tags}${g.ty ? "стратег" : "воїн"} · ATK ${g.atk} · DEF ${g.df} · HP ${g.hp}</div><div class="sks">${g.sk.map(id => img(SK[id].ic, "px sm", SK[id].n)).join("")}</div></div>`;
}
function genBody(g) {
  let h = `<div class="row" style="margin-top:10px">${img(g.hd, "px tall", "голова")}${kv([["Тип", g.ty ? "стратег" : "воїн"], ["Зброя", g.wep], ["База ATK", g.atk], ["База DEF", g.df], ["База HP", g.hp], ["Візит", g.visit ? "так" : "ні"]])}</div>`;
  h += `<h4>Скіли${g.visit ? " (вчить під час візиту)" : ""}</h4><div class="links">${g.sk.map(skillLink).join("")}</div>`;
  const where = g.in.map(([m, b]) => { const s = genStats(g, b); return `<tr><td>${misText(m)}</td><td class="num">+${b}</td><td class="num">${s.L}</td><td class="num">${s.atk}</td><td class="num">${s.df}</td><td class="num">${s.hp}</td><td>${MS[m].boss === g.id ? '<span class="tag bad">ціль</span>' : ""}</td></tr>`; }).join("");
  if (where) h += `<h4>Як ворог (при твоєму рівні ${heroLv})</h4><div class="scroll"><table><thead><tr><th>Місія</th><th>Бонус</th><th>Рівень</th><th>ATK</th><th>DEF</th><th>HP</th><th></th></tr></thead><tbody>${where}</tbody></table></div>`;
  else h += `<p class="small muted">У боях не з'являється.</p>`;
  if (g.talk.length) h += `<h4>Розмова після місії (+5 дружби)</h4><div class="links">${g.talk.map(misText).join(" ")}</div>`;
  return h;
}
function renderGenerals() {
  M.innerHTML = `<div class="tools">
    <input type="search" id="fq" placeholder="Ім'я генерала" aria-label="Ім'я генерала">
    <select id="fs" aria-label="Скіл"><option value="">Будь-який скіл</option>${D.skills.map(s => `<option value="${s.id}">${esc(s.n)}</option>`).join("")}</select>
    <label class="chk" for="fv"><input type="checkbox" id="fv"> лише для візитів</label>
    <label class="chk" for="fb"><input type="checkbox" id="fb"> лише цілі місій</label>
    <span class="count" id="cnt"></span></div><div class="list" id="L"></div>`;
  const f = () => {
    const q = $("fq").value.trim().toLowerCase(), s = +$("fs").value, v = $("fv").checked, b = $("fb").checked;
    const rows = D.gens.filter(g => (!q || g.n.toLowerCase().includes(q)) && (!s || g.sk.includes(s)) && (!v || g.visit) && (!b || g.boss.length));
    $("cnt").textContent = rows.length + " із " + D.gens.length;
    $("L").innerHTML = rows.map(g => entry("gen-" + g.id, genSum(g), () => genBody(g))).join("") || '<p class="empty">Нічого не знайдено.</p>';
  };
  ["fq", "fs", "fv", "fb"].forEach(id => $(id).addEventListener("input", f));
  f();
}

/* ---------- missions ---------- */
function misBody(m) {
  const g = GN[m.boss], s = genStats(g, m.bl);
  const sold = Object.entries(m.sold).filter(([, n]) => n).map(([t, n]) => `<span class="tag mute">${esc(D.enemies[t - 201].n)} ×${n}</span>`).join("");
  let h = `<div class="row" style="margin-top:10px">${img(m.rp, "por", m.rn)}<div class="sum"><b>${esc(m.rn)}</b><span class="small muted">правитель, якому ти служиш</span></div></div>`;
  h += kv([["Ціль", genText(m.boss)], ["Рівень цілі", `${s.L} (твій +${m.bl})`], ["Сила цілі", `ATK ${s.atk} · DEF ${s.df} · HP ${s.hp}`],
           ["Золото", `${m.gold} (Hard ${m.gold * 2})`], ["Бонус за час", `швидше ${m.time} с`], ["Кімнат на карті", SC[m.sc].rooms]]);
  h += `<h4>Вороги</h4><div class="links">${sold || '<span class="muted">без солдатів</span>'}</div>`;
  if (m.foes.length) h += `<div class="links" style="margin-top:6px">${m.foes.map(([id, b]) => `<span>${genText(id)} <span class="muted num">+${b}</span></span>`).join(" ")}</div>`;
  h += `<h4>Після перемоги</h4><p class="small">${m.end ? `<span class="tag gold">кінцівка</span>${esc(m.end)}` : m.talk ? `розмова з ${genText(m.talk)} (+5 дружби)` : "повернення в меню"}</p>`;
  if (m.fend) h += `<h4>Після поразки</h4><p class="small"><span class="tag gold">кінцівка</span>${esc(m.fend)}</p>`;
  if (m.fr.length) h += `<p class="small">Після зачистки кімнат: розмова з ${m.fr.map(genText).join(", ")}.</p>`;
  h += `<h4>Брифінг</h4><p class="brief">${esc(m.brief)}</p>`;
  return h;
}
function renderMissions() {
  M.innerHTML = `<p class="muted">45 сценаріїв, 102 місії. У сценарії можна взяти будь-яку місію; від вибору залежить, куди веде сюжет. Сценарії з позначкою «прихований» відкриваються як нагорода за кінцівки.</p>
    <div class="tools"><input type="search" id="fq" placeholder="Сценарій, правитель або ціль" aria-label="Пошук місії"><span class="count" id="cnt"></span></div><div id="L"></div>`;
  const f = () => {
    const q = $("fq").value.trim().toLowerCase();
    let n = 0;
    $("L").innerHTML = D.scen.map(sc => {
      const ms = sc.ms.map(id => MS[id]).filter(m => !q || [m.scn, m.rn, GN[m.boss].n].some(x => x.toLowerCase().includes(q)));
      if (!ms.length) return "";
      n += ms.length;
      return `<div class="scen"><h3>${sc.id}. ${esc(sc.n)}</h3>${sc.hidden ? '<span class="tag gold">прихований</span>' : ""}<span class="small muted">далі: ${sc.next.map(x => esc(SC[x].n)).join(", ") || "фінал"}</span></div><div class="list">${
        ms.map(m => entry("mis-" + m.id, `${img(GN[m.boss].img, "por sm", GN[m.boss].n)}<div class="sum"><h3>#${m.no} ${esc(m.rn)}</h3><div class="sub">ціль ${esc(GN[m.boss].n)} · +${m.bl} рівнів · ${m.gold} золота${m.end ? ` · <span class="tag gold">${esc(m.end)}</span>` : ""}</div></div>`, () => misBody(m))).join("")}</div>`;
    }).join("") || '<p class="empty">Нічого не знайдено.</p>';
    $("cnt").textContent = n + " із " + D.mis.length;
  };
  $("fq").addEventListener("input", f);
  f();
}

/* ---------- shell ---------- */
const $ = id => document.getElementById(id);
const M = $("main");
const BODY = {};
function entry(id, sum, body) { BODY[id] = body; return `<details class="e" id="${id}"><summary>${sum}</summary><div class="body"></div></details>`; }
M.addEventListener("toggle", e => {
  const d = e.target;
  if (d.tagName === "DETAILS" && d.open) { const b = d.querySelector(".body"); if (!b.dataset.ok) { b.innerHTML = BODY[d.id](); b.dataset.ok = 1; } }
}, true);
const TABS = {items: renderItems, skills: renderSkills, enemies: renderEnemies, generals: renderGenerals, missions: renderMissions};
const OWNER = {item: "items", cons: "items", skill: "skills", foe: "enemies", gen: "generals", mis: "missions"};
let current = "";
function route() {
  const h = location.hash.slice(1);
  const tab = TABS[h] ? h : OWNER[h.split("-")[0]] || "items";
  if (tab !== current || TABS[h]) { current = tab; TABS[tab](); }
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + tab ? "page" : "false"));
  if (!TABS[h] && h) {
    let el = $(h);
    if (!el) { ["fq"].forEach(id => { if ($(id)) { $(id).value = ""; $(id).dispatchEvent(new Event("input")); } }); ["fc", "ft", "fs"].forEach(id => { if ($(id)) { $(id).value = ""; } }); ["fl", "fv", "fb"].forEach(id => { if ($(id)) $(id).checked = false; }); if ($("fq")) $("fq").dispatchEvent(new Event("input")); el = $(h); }
    if (el) {
      document.querySelectorAll("details.hl").forEach(x => x.classList.remove("hl"));
      if (el.tagName === "DETAILS") { el.open = true; el.classList.add("hl"); }
      el.scrollIntoView({block: "start"}); window.scrollBy(0, -60);
    }
  } else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
$("hl").addEventListener("change", () => {
  heroLv = Math.max(1, Math.min(200, +$("hl").value || 1)); $("hl").value = heroLv;
  try { localStorage.setItem("enc-lv", heroLv); } catch (e) {}
  const open = [...document.querySelectorAll("details.e[open]")].map(d => d.id);
  TABS[current]();
  open.forEach(id => { const d = $(id); if (d) d.open = true; });
});

/* global search */
const INDEX = [].concat(
  allItems.map(i => ({k: (i.cat === "c" ? "cons-" : "item-") + i.id, n: i.n, t: CAT[i.cat] + " предмет", ic: [i.ic, "px sm"]})),
  D.skills.map(s => ({k: "skill-" + s.id, n: s.n, t: "скіл · " + s.d, ic: [s.ic, "px sm"]})),
  D.gens.map(g => ({k: "gen-" + g.id, n: g.n, t: "генерал", ic: [g.img, "por sm"]})),
  D.scen.map(s => ({k: "mis-" + s.ms[0], n: s.n, t: "сценарій, " + s.ms.length + " міс.", ic: [GN[MS[s.ms[0]].boss].img, "por sm"]})),
  D.enemies.map(e => ({k: "foe-" + e.id, n: e.n, t: "солдат", ic: [e.ic, "px sm"]})));
$("q").addEventListener("input", () => {
  const q = $("q").value.trim().toLowerCase(), R = $("results");
  if (!q) { R.hidden = true; return; }
  const hits = INDEX.filter(x => x.n.toLowerCase().includes(q)).slice(0, 30);
  R.hidden = false;
  R.innerHTML = hits.map(x => `<a href="#${x.k}">${img(x.ic[0], x.ic[1])}<span class="n">${esc(x.n)}</span><span class="small muted">${esc(x.t)}</span></a>`).join("") || '<p class="empty">Нічого не знайдено.</p>';
});
$("results").addEventListener("click", e => { if (e.target.closest("a")) { $("q").value = ""; $("results").hidden = true; } });
route();
</script>
