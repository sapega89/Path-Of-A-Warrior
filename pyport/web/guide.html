<style>
/* Layout: a field manual — sticky tab bar, one column of dense reference panels; icons kept at native pixel scale ×1.5 */
:root{
  --bg:#e4e8e5; --panel:#f3f5f3; --line:#c3cbc6; --fg:#18201c; --muted:#56635c;
  --accent:#2747a8; --accent-soft:#dce3f7; --gold:#9a6a00; --gold-soft:#f6e7bf; --bad:#a12d2d; --bad-soft:#f5dcdc; --ok:#2b6b3f; --ok-soft:#d9eedf;
  --f-display:"Press Start 2P","Courier New",monospace; --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --panel:#19201c; --line:#2d3833; --fg:#e2e8e4; --muted:#93a39a;
  --accent:#8ea8ff; --accent-soft:#1f2a4d; --gold:#e8b64a; --gold-soft:#3a2f12; --bad:#ff8c8c; --bad-soft:#3d1c1c; --ok:#7fd59a; --ok-soft:#173222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#19201c; --line:#2d3833; --fg:#e2e8e4; --muted:#93a39a;
  --accent:#8ea8ff; --accent-soft:#1f2a4d; --gold:#e8b64a; --gold-soft:#3a2f12; --bad:#ff8c8c; --bad-soft:#3d1c1c; --ok:#7fd59a; --ok-soft:#173222; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 14px}
h1{font:400 clamp(16px,3.4vw,24px)/1.4 var(--f-display);margin:0 0 10px;letter-spacing:.02em;text-wrap:balance}
.lede{color:var(--muted);max-width:68ch;margin:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
nav a{font:400 10px/1 var(--f-display);text-decoration:none;color:var(--muted);padding:10px 12px;border-radius:4px;white-space:nowrap}
nav a[aria-current="page"]{background:var(--fg);color:var(--bg)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px}
h2{font:400 13px/1.5 var(--f-display);margin:28px 0 12px;text-wrap:balance}
h2:first-child{margin-top:0}
h3{font:800 19px/1.3 var(--f-body);margin:0 0 4px}
p{max-width:70ch}
.px{image-rendering:pixelated;width:42px;height:42px;flex:none}
.px.sm{width:28px;height:28px}
.por{image-rendering:pixelated;width:69px;height:69px;border:1px solid var(--line);flex:none;background:var(--panel)}
.secrets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.card p{margin:6px 0 0}
.card.key{border-color:var(--gold);background:var(--gold-soft)}
.tag{display:inline-block;font:600 12px/1 var(--f-mono);padding:4px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin:2px 4px 2px 0;white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 12px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
tr.ult td{background:var(--gold-soft)}
.skn{display:flex;align-items:center;gap:10px;min-width:190px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
input[type=search],select{font:16px var(--f-body);padding:9px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--fg);min-width:0}
input[type=search]{flex:1 1 240px}
label.chk{display:flex;gap:6px;align-items:center;font-size:15px}
.rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec.locked{opacity:.62}
.ing{display:flex;align-items:center;gap:6px;min-width:0}
.ing button,.link{font:inherit;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.plus,.arrow{color:var(--muted);font-family:var(--f-mono)}
.res{font-weight:800}
.meta{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.it{display:flex;gap:12px}
.it .body{min-width:0}
.it h3{font-size:17px}
.small{font-size:14px}
.gens{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.g{display:flex;gap:14px}
.g ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.sks{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.sks img{border-radius:3px}
.sks img.u{outline:2px solid var(--gold)}
.count{font:600 13px var(--f-mono);color:var(--muted)}
.empty{padding:20px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

const HIDE_PRE={};P.hid.forEach(h=>HIDE_PRE[h]=P.nx.map((l,i)=>l.includes(h)?i:-1).filter(i=>i>0));
V.progress=()=>`<h2>Як стежити за прогресом</h2>
<div class="secrets">
<div class="card"><h3>Окремого екрана немає</h3><p>Гра показує загальну статистику лише один раз, після кожної кінцівки: місії x/102, приховані місії x/18, кінцівки x/24, генерали x/44. Список місій не позначає, що ти вже пройшов.</p></div>
<div class="card"><h3>Кінцівки видно завжди</h3><p>Main Menu → Endings. Зібрані кінцівки там білі, а незібрані сірі.</p></div>
<div class="card key"><h3>«Hidden Mission!»: де шукати</h3><p>Попап означає, що гра відкрила один із 10 прихованих сценаріїв. Окремого місця для нього немає: він з'явиться в списку Missions (уже не сірим), коли ти пройдеш сценарій, що стоїть перед ним. Після кінцівки кампанія часто повертається на початок, тож доведеться знову дійти до потрібного місця.</p></div>
<div class="card"><h3>Найточніше: твій сейв</h3><p>Нижче завантаж файл сейву, і сторінка покаже все, що гра зберігає: пройдені місії, кінцівки, відкриті приховані сценарії, друзів і рівні скілів.</p></div>
</div>
<h2>10 прихованих сценаріїв</h2>
<div class="scroll"><table><thead><tr><th>Прихований сценарій</th><th>Місій</th><th>З'являється в списку після</th>${SAVE?'<th>У тебе</th>':''}</tr></thead><tbody>
${P.hid.map(h=>`<tr><td><b>${scN(h)}</b></td><td class="num">${P.sc[h][1]}</td><td>${HIDE_PRE[h].map(scN).join(', ')}</td>${SAVE?`<td>${SAVE.scDone(h)?'<span class="tag ok">пройдено</span>':SAVE.open(h)?'<span class="tag gold">відкрито</span>':'<span class="tag bad">закрито</span>'}</td>`:''}</tr>`).join('')}
</tbody></table></div>
<p class="small muted">Скрипт перевірив, що з прихованими сценаріями досяжні всі 45, а без них 35.</p>
<h2>Мій сейв</h2>
<div class="card"><p style="margin-top:0">Десктоп: файл <span class="num">gamevil_pow_data.rms.json</span> у папці <span class="num">~/.path_of_a_warrior/</span> (у Windows це <span class="num">C:\Users\&lt;ім'я&gt;\.path_of_a_warrior\</span>). Браузерна версія: у консолі сторінки гри виконай <span class="num">copy(localStorage.rms_gamevil_pow_data)</span> і встав сюди. Файл ніде не надсилається, усе рахується в цьому вікні.</p>
<div class="tools" style="margin:10px 0 0"><input type="file" id="sf" accept=".json,application/json"><span class="muted">або</span><input type="search" id="sp" placeholder="встав вміст сейву" style="flex:1 1 200px"></div>

<div id="sout">${SAVE?saveView():''}</div>

${P.en.map(([n,t],i)=>`<tr><td class="num">${i+1}</td><td><b>${esc(n)}</b></td><td class="small">${esc(trig(t))}</td>${SAVE?`<td>${SAVE.ed&(1<<i)?'<span class="tag ok">є</span>':'<span class="tag">—</span>'}</td>`:''}</tr>`).join('')}
</tbody></table></div>`;
function parseSave(txt){
 let j=JSON.parse(txt.trim());if(typeof j==='string')j=JSON.parse(j);
 const r=Uint8Array.from(atob(j[0]),c=>c.charCodeAt(0));
 if(r.length<530||(r[0]|r[1]<<8)===0)throw new Error('empty');
 const u=(o,n)=>{let v=0n;for(let k=n-1;k>=0;k--)v=(v<<8n)|BigInt(r[o+k]);return v};
 const name=String.fromCharCode(...r.slice(2,10)).trim();
 const dw=u(22,8),dx=u(30,8),dy=[...Array(8)].map((_,k)=>Number(u(38+4*k,4))),ed=Number(u(74,4));
 const fo=r[166],fr=[...Array(fo)].map((_,k)=>[r[78+2*k],r[79+2*k]]);
 const s={name,lvl:r[471],gold:Number(u(484,4)),fame:Number(u(488,4)),cq:r[442],ed,fr,W:[...r.slice(506,525)],S:r[500],
  open:h=>((dw>>BigInt(h-1))&1n)===1n,scDone:h=>((dx>>BigInt(h-1))&1n)===1n,
  mDone:(sc,m)=>{const i=(sc-1)*5+m;return (dy[i>>5]>>>(i&31))&1}};
 return s;
}
function saveView(){
 const s=SAVE;let mt=0,ht=0,md=0,hd=0;
 for(let sc=1;sc<=45;sc++)for(let m=0;m<P.sc[sc][1];m++){const d=s.mDone(sc,m);if(P.hid.includes(sc)){ht++;hd+=d}else{mt++;md+=d}}
 const ec=P.en.filter((_,i)=>s.ed&(1<<i)).length;
 const now=P.nx[s.cq]||[];
 const scRows=[];for(let sc=1;sc<=45;sc++){const n=P.sc[sc][1],done=[...Array(n)].map((_,m)=>s.mDone(sc,m));
  scRows.push(`<tr><td><b>${scN(sc)}</b>${P.hid.includes(sc)?' <span class="tag gold">прихований</span>':''}</td><td>${done.map((d,m)=>`<span class="tag ${d?'ok':''}">${m+1}</span>`).join('')}</td><td>${s.open(sc)?'':'<span class="tag bad">закрито</span>'}</td></tr>`)}
 const fr=s.fr.map(([id,f])=>{const g=D.gen.find(x=>x.id===id);return g?`<tr><td><button class="link" data-gen="${id}">${esc(g.n)}</button></td><td class="num">${f}%</td><td>${g.sk.map(k=>`<img class="px sm" src="${D.skillic[k-1]}" alt="${SK[k-1][0]}" title="${SK[k-1][0]}">`).join('')}</td></tr>`:''}).join('');
 return `<h2>${esc(s.name)}: рівень ${s.lvl}</h2>
 <div class="secrets">
 <div class="card"><h3 class="num">${md} / ${mt}</h3><p>звичайних місій пройдено</p></div>
 <div class="card"><h3 class="num">${hd} / ${ht}</h3><p>місій прихованих сценаріїв</p></div>
 <div class="card"><h3 class="num">${ec} / 24</h3><p>кінцівок зібрано</p></div>
 <div class="card"><h3 class="num">${s.fr.length} / 44</h3><p>генералів у друзях · золото ${s.gold.toLocaleString('uk')} · Fame ${s.fame}</p></div>
 <div class="card key"><h3>Зараз у списку Missions</h3><p>${now.length?now.map(x=>`${scN(x)}${s.open(x)?'':' (сірий, закритий)'}`).join('<br>'):'нічого'}</p><p class="small">${s.S?'Візит зараз доступний.':'Візит відкриється після наступної місії.'}</p></div>
 </div>
 <h2>Скіли</h2><div class="sks">${s.W.map((l,i)=>`<span class="tag ${l?(ULT.includes(i+1)?'gold':'ok'):''}" title="${SK[i][0]}">${icon(l?D.skillic[i]:D.skillgray[i],'px sm',SK[i][0])} ${l||'—'}</span>`).join('')}</div>
 <h2>Друзі</h2>${fr?`<div class="scroll"><table><thead><tr><th>Генерал</th><th>Дружба</th><th>Може навчити</th></tr></thead><tbody>${fr}</tbody></table></div>`:'<p class="muted">Поки нікого.</p>'}
 <h2>Місії за сценаріями</h2><div class="scroll"><table><thead><tr><th>Сценарій</th><th>Місії (зелені пройдено)</th><th></th></tr></thead><tbody>${scRows.join('')}</tbody></table></div>`;
}
function loadSave(txt){const e=document.getElementById('serr');try{SAVE=parseSave(txt);e.textContent='';show()}catch(x){e.textContent='Не вдалося прочитати сейв. Потрібен файл gamevil_pow_data.rms.json або його вміст повністю.'}}

function show(){
 let h=(location.hash||'#secrets').slice(1);let gen=null;
 if(h.startsWith('gen-')){gen=h;h='visits'}
 if(!V[h])h='secrets';
 document.querySelectorAll('#tabs a').forEach(a=>a.getAttribute('href')==='#'+h?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 document.getElementById('main').innerHTML=V[h]();
 if(h==='recipes'){drawRec();rq.oninput=e=>{RQ=e.target.value;drawRec()};ronly.onchange=e=>{RONLY=e.target.checked;drawRec()}}
 if(h==='progress'){sf.onchange=e=>{const f=e.target.files[0];if(f)f.text().then(loadSave)};sp.onchange=e=>loadSave(e.target.value)}
 if(h==='items'){drawItems();iq.oninput=e=>{IQ=e.target.value;drawItems()};ic.onchange=e=>{IC=e.target.value;drawItems()}}
 if(h==='progress'&&SAVE){}
 if(gen){const el=document.getElementById(gen);if(el){el.scrollIntoView();el.classList.add('key')}}else window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-item],[data-gen]');if(!b)return;
 if(b.dataset.item){RQ=IT[b.dataset.item].n;RONLY=false;if(location.hash==='#recipes')show();else location.hash='recipes'}
 else location.hash='gen-'+b.dataset.gen});
addEventListener('hashchange',show);show();
</script>
