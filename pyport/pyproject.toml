[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # long lines: the ported code keeps the Java line layout
    "E741",  # `l` / `O` / `I`: names that come from the Java source
    "B007",  # unused loop variables of ported `for` loops
]

[tool.ruff.lint.per-file-ignores]
# the MP client was machine-translated from Java: dead locals and bare `None` statements stay as in g.java
"pow_mp/*.py" = ["F841", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
